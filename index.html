<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Collection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="sidebar">
        <input type="checkbox" id="checkmn" checked />
        <label for="checkmn" id="toggle-btn">☰</label>

        <a href="index.html" class="active">📊 <span>Character Status</span></a>
        <a href="create.html">➕ <span>Create New Character</span></a>
        <a href="tier_list.html">🏆 <span>Tier List</span></a> 
        <a href="enemy_location.html">🗺️ <span>Enemy Location</span></a>
        <a href="update_list.html">📝 <span>Character Update</span></a>
        <a href="backup_recovery.html">💾 <span>Backup/Recovery</span></a>
    </div>

    <div id="main-content">
        <h1>Current Character Status</h1>
        
        <div id="filter-controls">
            <label for="sort-by">Sort:</label>
            <select id="sort-by">
                <option value="power" selected>Power</option>
                <option value="skillProgress">Skill Progress</option>
                <option value="default">Default (Element &gt; Role &gt; Rank)</option>
                <option value="level">Level</option>
                <option value="star">Star</option>
                <option value="cardLevel">Card Level</option>
                <option value="cardStar">Card Star</option>
                <option value="shards">Shards</option>
            </select>
            <button id="sort-button">Sort</button>

            <span class="spacer"></span>
            <button id="import-button" class="tool-btn">Import JSON</button>
            <button id="export-button" class="tool-btn">Export JSON</button>
            <input type="file" id="import-file" accept=".json,application/json" hidden>
        </div>

        <div id="card-container"></div>
        
        <div id="load-error"></div>
    </div>

  <script src="character_data.js"></script>
  <script>
    // Konstanta kunci penyimpanan (format di localStorage tetap flat, supaya halaman lain tidak rusak)
    const STORAGE_KEY = 'CHARACTER_DATA_V1';
    let charactersData = []; 

    // --- FUNGSI IKON BINTANG ---
    // Max 12 bintang, tampil selalu 6 slot.
    // 1-6  : bintang emas sebanyak nilainya.
    // 7-12 : (nilai - 6) slot pertama berubah jadi ungu platinum, menimpa bintang emas.
    //        Contoh 8 bintang = 2 ungu + 4 emas.
    function generateStarIcons(currentStar) {
        const slots = 6;
        const total = Math.max(0, Math.min(parseInt(currentStar) || 0, 12));
        const platinum = Math.max(0, total - slots);
        const gold = Math.min(total, slots);
        let starsHtml = '';
        for (let i = 0; i < slots; i++) {
            if (i < platinum) {
                starsHtml += '<span style="color:#c58bff; text-shadow:0 0 5px #9c4dff, 0 0 2px #e6ccff;">★</span>';
            } else if (i < gold) {
                starsHtml += '<span style="color:gold;">★</span>';
            } else {
                starsHtml += '<span style="color:#444;">☆</span>';
            }
        }
        return starsHtml;
    }

    const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    // --- GENERATE HTML MODE BACA (READ-ONLY) ---
    //  Tier 1: img, nama, element, role, rank        (header)
    //  Tier 2: star, skills, power, level, shards    (body)
    //  Tier 3: card, intimacy, 4 wear                (panel info ℹ️)
    function createCardHTML(data, index) {
        const currentShards = parseInt(data.shards) || 0;
        const maxShards = parseInt(data.shardMax) || 0;
        const restShards = Math.max(0, maxShards - currentShards);
        const shardPercentage = maxShards > 0 ? Math.min((currentShards / maxShards) * 100, 100) : 0;
        const elementClass = `element-${data.element}`;
        const starIcons = generateStarIcons(data.star); 
        const cardStarIcons = generateStarIcons(data.cardStar);

        // Data for skill progress
        const skillProgress = data.skillProgress || { tracked: false, skill: 'skillTwo', current: 0, max: 1000 };
        const isTracked = skillProgress.tracked;
        const skillProgressPercentage = Math.min((skillProgress.current / skillProgress.max) * 100, 100);
        const skillNameMap = { skillOne: 'Skill 1', skillTwo: 'Skill 2', skillThree: 'Skill 3' };
        const trackedSkillName = skillNameMap[skillProgress.skill] || 'Skill';

        const skillLevels = [data.skillOneLevel, data.skillTwoLevel, data.skillThreeLevel, data.skillFourLevel];
        const skillDetailHTML = skillLevels.map((lv, i) => {
            const info = (data.skillInfo || [])[i] || '';
            return `<div class="skill-item">
                        <div class="skill-item-head">${esc((data.skillIcon || [])[i])} Skill ${i + 1} · Lv <span>${lv}</span></div>
                        <div class="skill-item-body">${info ? safeInfo(info) : '<span class="skill-empty">Belum ada info</span>'}</div>
                    </div>`;
        }).join('');

        const wearLabels = { bracelet: 'Bracelet', bikini: 'Bikini', hat: 'Hat', sandals: 'Sandals' };
        const wearHTML = WEAR_KEYS.map(k => {
            const v = data[k];
            const empty = !v || v === 'e';
            return `<div class="info-cell"><span class="grid-label">${wearLabels[k]}</span><span class="grid-value ${empty ? 'wear-empty' : ''}">${empty ? '-' : v}</span></div>`;
        }).join('');

        return `
            <div class="char-card ${elementClass} ${isTracked ? 'progress-tracked' : ''}" id="card-${index}" onclick="handleCardClick(this, event)"> 

                <!-- TIER 1 -->
                <div class="card-header">
                    <div class="grid-2-row header-left">
                        <span class="char-icon"><img src="img/${data.name}.png" alt="${data.name}" onerror="this.src='img/default.png'"></span>
                        <span class="char-rank rank-${data.rank}">${data.rank}</span>
                    </div>
                    <div class="header-right">
                        <div class="header-top-right">
                            <button class="bookmark-btn" title="Track skill progress" onclick="toggleSkillProgress(${index}, event)">
                                <svg fill="currentColor" viewBox="0 0 20 20"><path d="M5 4a2 2 0 012-2h6a2 2 0 012 2v14l-5-2.5L5 18V4z"></path></svg>
                            </button>
                            <button class="edit-btn info-btn" title="Detail" onclick="toggleInfo(${index}, event)">ℹ️</button>
                            <button class="edit-btn" title="Edit" onclick="activateEditMode(${index}, event)">✏️</button>
                        </div>
                        <span class="char-name">${data.name}</span>
                        <span class="char-tags">
                            <span class="char-tag">${data.element}</span>
                            <span class="char-tag"><img src="icon/${data.role}.png"/></span>
                        </span>
                    </div>
                </div>

                <!-- TIER 2 -->
                <div class="grid-3 main-stats">
                    <div class="grid-item"><span class="grid-label">Star</span><span class="grid-value star-value">${starIcons}</span></div>
                    <div class="grid-item"><span class="grid-label">Level</span><span class="grid-value">${data.level}</span></div>
                    <div class="grid-item"><span class="grid-label">⚔️ Power</span><span class="grid-value">${data.power}</span></div>
                </div>

                <div class="grid-5">
                    <div class="label grid-item" style="margin-top: 5px;">Skills <button class="eye-btn" title="Lihat detail skill" onclick="toggleSkillInfo(${index}, event)">👁</button></div>
                    <div class="grid-item"><span class="grid-label">S1</span><span class="grid-value">${data.skillOneLevel}</span><span class="skill-icon">${esc((data.skillIcon || [])[0])}</span></div>
                    <div class="grid-item"><span class="grid-label">S2</span><span class="grid-value">${data.skillTwoLevel}</span><span class="skill-icon">${esc((data.skillIcon || [])[1])}</span></div>
                    <div class="grid-item"><span class="grid-label">S3</span><span class="grid-value">${data.skillThreeLevel}</span><span class="skill-icon">${esc((data.skillIcon || [])[2])}</span></div>
                    <div class="grid-item"><span class="grid-label">S4</span><span class="grid-value">${data.skillFourLevel}</span><span class="skill-icon">${esc((data.skillIcon || [])[3])}</span></div>
                </div>

                <div class="skill-detail">${skillDetailHTML}</div>

                <div class="grid-2-row skill-progress-details">
                    <div class="grid-item" style="border:none; padding:0;">
                        <span class="grid-label skill-progress-name"><b>${trackedSkillName} ▶</b></span>
                    </div>
                    <div class="grid-item">
                        <span class="grid-label skill-progress-name"><b>${skillProgress.current} / ${skillProgress.max} (<span style="color:#ff7043;">${skillProgress.max - skillProgress.current}</span>)</b></span>
                        <div class="grid-value progress-bg">
                            <div class="progress-fill" style="width: ${skillProgressPercentage}%"></div>
                        </div>
                    </div>
                </div>

                <div class="grid-2-row single">
                    <div class="grid-item" style="border:none; padding:0;">
                        <span class="grid-label">Shards <b>${currentShards} / ${maxShards} (<span style="color:#ff7043;">${restShards}</span>)</b></span>
                        <div class="grid-value progress-bg">
                            <div class="progress-fill" style="width: ${shardPercentage}%"></div>
                        </div>
                    </div>
                </div>

                <!-- TIER 3 (hanya muncul lewat tombol ℹ️) -->
                <div class="info-panel">
                    <p class="info-section-title">Card &amp; Intimacy</p>
                    <div class="info-row">
                        <div class="info-cell"><span class="grid-label">Card Lv</span><span class="grid-value">${data.cardLevel}</span></div>
                        <div class="info-cell"><span class="grid-label">Card Star</span><span class="grid-value star-value">${cardStarIcons}</span></div>
                        <div class="info-cell"><span class="grid-label">Intimacy</span><span class="grid-value">${data.intimacy}</span></div>
                    </div>
                    <p class="info-section-title">Wear</p>
                    <div class="info-wear">${wearHTML}</div>
                </div>
            </div>
        `;
    }

    // --- GENERATE HTML MODE EDIT (FORM INPUT) ---
    function createEditFormHTML(data, index) {
        const elementClass = `element-${data.element}`;
        const skillProgress = data.skillProgress || { tracked: false, skill: 'skillTwo', current: 0, max: 1000 };
        const wearVal = k => (data[k] && data[k] !== 'e') ? data[k] : '';
        const wearLabels = { bracelet: 'Bracelet', bikini: 'Bikini', hat: 'Hat', sandals: 'Sandals' };

        return `
            <div class="char-card ${elementClass}" style="border: 2px solid var(--accent); cursor: default;" onclick="event.stopPropagation()"> 
                <div class="card-header">
                     <div class="header-left">
                        <span class="char-icon"><img src="img/${data.name}.png" onerror="this.src='img/default.png'"></span>
                     </div>
                    <div class="header-right">
                        <span class="grid-item char-name">${data.name}</span>
                        <input type="number" class="edit-input" id="edit-star-${index}" value="${data.star}" min="1" max="12" placeholder="Star">
                    </div>
                </div>
                
                 <div class="grid-5 main-stats">
                    <div class="grid-item"><span class="grid-label">Level</span><input type="number" class="edit-input" id="edit-level-${index}" value="${data.level}"></div>
                    <div class="grid-item"><span class="grid-label">Intimacy</span><input type="number" class="edit-input" id="edit-intimacy-${index}" value="${data.intimacy}"></div>
                    <div class="grid-item"><span class="grid-label">Element</span>
                        <select class="edit-input" id="edit-element-${index}"></select>
                    </div>
                    <div class="grid-item"><span class="grid-label">Role</span><input type="text" class="edit-input" id="edit-role-${index}" value="${data.role}"></div>
                    <div class="grid-item"><span class="grid-label">⚔️ Power</span><input type="text" class="edit-input" id="edit-power-${index}" value="${data.power}"></div>
                </div>

                <div class="grid-5">
                    <div class="label grid-item">Skills</div>
                    <div class="grid-item"><span class="grid-label">S1</span><input type="number" class="edit-input" id="edit-s1-${index}" value="${data.skillOneLevel}"></div>
                    <div class="grid-item"><span class="grid-label">S2</span><input type="number" class="edit-input" id="edit-s2-${index}" value="${data.skillTwoLevel}"></div>
                    <div class="grid-item"><span class="grid-label">S3</span><input type="number" class="edit-input" id="edit-s3-${index}" value="${data.skillThreeLevel}"></div>
                    <div class="grid-item"><span class="grid-label">S4</span><input type="number" class="edit-input" id="edit-s4-${index}" value="${data.skillFourLevel}"></div>
                </div>
                
                <div class="edit-skill-progress">
                    <div class="grid-item"><span class="grid-label">Tracked Skill</span>
                        <select class="edit-input" id="edit-trackedSkill-${index}">
                            <option value="skillOne" ${skillProgress.skill === 'skillOne' ? 'selected' : ''}>Skill 1</option>
                            <option value="skillTwo" ${skillProgress.skill === 'skillTwo' ? 'selected' : ''}>Skill 2</option>
                            <option value="skillThree" ${skillProgress.skill === 'skillThree' ? 'selected' : ''}>Skill 3</option>
                        </select>
                    </div>
                    <div class="grid-item"><span class="grid-label">Current</span>
                        <input type="number" class="edit-input" id="edit-skillCurrent-${index}" value="${skillProgress.current}">
                    </div>
                    <div class="grid-item"><span class="grid-label">Max</span>
                        <input type="number" class="edit-input" id="edit-skillMax-${index}" value="${skillProgress.max}">
                    </div>
                </div>

                <div class="grid-2-row">
                    <div class="grid-item" style="border:none;">
                         <span class="grid-label">Shards (Cur/Max)</span>
                         <div style="display:flex; gap:2px;">
                            <input type="number" class="edit-input" id="edit-shards-${index}" value="${data.shards}">
                            <input type="number" class="edit-input" id="edit-shardMax-${index}" value="${data.shardMax}">
                         </div>
                    </div>
                    <div class="grid-item" style="border:none;">
                        <span class="grid-label">Card Lv/Star</span>
                        <div style="display:flex; gap:2px;">
                            <input type="number" class="edit-input" id="edit-cardLevel-${index}" value="${data.cardLevel}">
                            <input type="number" class="edit-input" id="edit-cardStar-${index}" value="${data.cardStar}">
                        </div>
                    </div>
                </div>

                <div class="edit-skill-info">
                    ${[0, 1, 2, 3].map(i => `
                        <div><span class="grid-label">Skill ${i + 1} — icon &amp; info (&lt;b&gt;summary&lt;/b&gt;deskripsi)</span>
                            <div class="edit-skill-row">
                                <input type="text" class="edit-input edit-skill-icon" id="edit-skillIcon${i}-${index}" value="${esc((data.skillIcon || [])[i])}" placeholder="🔥">
                                <textarea class="edit-input" id="edit-skillInfo${i}-${index}" rows="2">${esc((data.skillInfo || [])[i])}</textarea>
                            </div>
                        </div>`).join('')}
                </div>

                <div class="edit-wear">
                    ${WEAR_KEYS.map(k => `
                        <div class="grid-item"><span class="grid-label">${wearLabels[k]}</span>
                            <input type="text" class="edit-input" id="edit-${k}-${index}" value="${wearVal(k)}" placeholder="T6">
                        </div>`).join('')}
                </div>

                <div class="action-buttons">
                    <button class="btn-cancel" onclick="cancelEdit(${index})">Batal</button>
                    <button class="btn-save" onclick="saveEdit(${index})">Simpan</button>
                </div>
            </div>
        `;
    }

    // --- LOGIKA UTAMA (RENDER) ---
    function displayCharacters(data) {
        const container = document.getElementById('card-container');
        container.innerHTML = '';
        if (data.length === 0) {
            container.innerHTML = '<p style="text-align:center; width:100%;">Belum ada data karakter.</p>';
            return;
        }
        container.innerHTML = data.map(character => createCardHTML(character, charactersData.indexOf(character))).join('');
    }

    function refresh() {
        displayCharacters(sortCharacters(charactersData, document.getElementById('sort-by').value));
    }

    function persist() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(charactersData));
    }

    // --- EVENT HANDLERS ---
    
    function handleCardClick(cardElement, event) {
        if (event.target.closest('button')) return; // Don't activate if a button was clicked
        document.querySelectorAll('.char-card').forEach(c => {
            if (c !== cardElement) c.classList.remove('active-card');
        });
        cardElement.classList.toggle('active-card');
    }

    function toggleInfo(index, event) {
        event.stopPropagation();
        const card = document.getElementById(`card-${index}`);
        card.classList.toggle('show-info');
    }

    function toggleSkillInfo(index, event) {
        event.stopPropagation();
        document.getElementById(`card-${index}`).classList.toggle('show-skills');
    }

    function toggleSkillProgress(index, event) {
        event.stopPropagation();
        charactersData[index].skillProgress.tracked = !charactersData[index].skillProgress.tracked;
        persist();
        refresh();
    }

    function activateEditMode(index, event) {
        event.stopPropagation();
        const cardContainer = document.getElementById(`card-${index}`);
        const currentData = charactersData[index];
        cardContainer.outerHTML = createEditFormHTML(currentData, index);
        const elementSelect = document.getElementById(`edit-element-${index}`);
        ELEMENT_ORDER.forEach(el => {
            const option = document.createElement('option');
            option.value = el;
            option.text = el;
            if (el === currentData.element) option.selected = true;
            elementSelect.appendChild(option);
        });
    }

    function cancelEdit(index) {
        refresh();
    }

    function saveEdit(index) {
        const updatedChar = { ...charactersData[index] };
        const val = id => document.getElementById(`${id}-${index}`).value;
        
        updatedChar.star = parseInt(val('edit-star')) || 0;
        updatedChar.level = parseInt(val('edit-level')) || 0;
        updatedChar.intimacy = parseInt(val('edit-intimacy')) || 0;
        updatedChar.element = val('edit-element');
        updatedChar.role = val('edit-role');
        updatedChar.power = val('edit-power');
        updatedChar.skillOneLevel = parseInt(val('edit-s1')) || 0;
        updatedChar.skillTwoLevel = parseInt(val('edit-s2')) || 0;
        updatedChar.skillThreeLevel = parseInt(val('edit-s3')) || 0;
        updatedChar.skillFourLevel = parseInt(val('edit-s4')) || 0;
        updatedChar.shards = val('edit-shards');
        updatedChar.shardMax = val('edit-shardMax');
        updatedChar.cardLevel = parseInt(val('edit-cardLevel')) || 0;
        updatedChar.cardStar = parseInt(val('edit-cardStar')) || 0;
        WEAR_KEYS.forEach(k => { updatedChar[k] = val(`edit-${k}`).trim() || 'e'; });
        updatedChar.skillInfo = [0, 1, 2, 3].map(i => val(`edit-skillInfo${i}`).trim());
        updatedChar.skillIcon = [0, 1, 2, 3].map(i => val(`edit-skillIcon${i}`).trim());

        updatedChar.skillProgress = { ...updatedChar.skillProgress };
        updatedChar.skillProgress.skill = val('edit-trackedSkill');
        updatedChar.skillProgress.current = parseInt(val('edit-skillCurrent')) || 0;
        updatedChar.skillProgress.max = parseInt(val('edit-skillMax')) || 1; // Avoid division by zero

        charactersData[index] = updatedChar;
        persist();
        refresh();
    }

    // --- FUNGSI SORTING & LOAD DATA ---
    function sortCharacters(data, criteria) {
        if (criteria === 'skillProgress') {
            return [...data].sort((a, b) => {
                const aTracked = a.skillProgress?.tracked || false;
                const bTracked = b.skillProgress?.tracked || false;
                if (aTracked && !bTracked) return -1;
                if (!aTracked && bTracked) return 1;
                if (aTracked && bTracked) {
                    const progressA = (a.skillProgress.current / a.skillProgress.max) || 0;
                    const progressB = (b.skillProgress.current / b.skillProgress.max) || 0;
                    if (progressB !== progressA) return progressB - progressA;
                }
                return parsePower(b.power) - parsePower(a.power);
            });
        }
        if (criteria === 'default') {
            // Sama dengan urutan JSON: element > role > rank > power
            return [...data].sort((a, b) =>
                orderIdx(ELEMENT_ORDER, a.element) - orderIdx(ELEMENT_ORDER, b.element) ||
                orderIdx(ROLE_ORDER, a.role) - orderIdx(ROLE_ORDER, b.role) ||
                orderIdx(RANK_ORDER, a.rank) - orderIdx(RANK_ORDER, b.rank) ||
                parsePower(b.power) - parsePower(a.power)
            );
        }
        if (criteria === 'power') {
            return [...data].sort((a, b) => parsePower(b.power) - parsePower(a.power));
        }
        if (criteria === 'shards') {
            return [...data].sort((a, b) => {
                const restA = (parseFloat(a.shardMax) || 0) - (parseFloat(a.shards) || 0);
                const restB = (parseFloat(b.shardMax) || 0) - (parseFloat(b.shards) || 0);
                return restA - restB; 
            });
        }
        if (['level', 'star', 'cardLevel', 'cardStar'].includes(criteria)) {
            return [...data].sort((a, b) => (parseInt(b[criteria]) || 0) - (parseInt(a[criteria]) || 0));
        }
        return data;
    }

    function showError(msg) {
        const el = document.getElementById('load-error');
        el.textContent = msg;
        el.style.display = msg ? 'block' : 'none';
    }

    async function loadData() {
        const storedData = localStorage.getItem(STORAGE_KEY);
        if (storedData) {
            charactersData = migrate(normalizeImported(JSON.parse(storedData)));
            persist(); // simpan balik hasil migrasi
            refresh();
            return;
        }
        // Belum ada data tersimpan: coba muat characters_grouped.json di folder yang sama
        try {
            const res = await fetch('characters_grouped.json');
            if (!res.ok) throw new Error(res.status);
            charactersData = migrate(normalizeImported(await res.json()));
            persist();
            refresh();
        } catch (err) {
            showError('Belum ada data. Pakai tombol Import JSON untuk memuat file karakter.');
            displayCharacters([]);
        }
    }

    // --- IMPORT / EXPORT ---
    function exportJSON() {
        const text = stringifyGrouped(groupCharacters(charactersData));
        const blob = new Blob([text], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `characters_grouped_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(a.href);
    }

    function importJSON(file) {
        const reader = new FileReader();
        reader.onload = () => {
            try {
                const list = migrate(normalizeImported(JSON.parse(reader.result)));
                if (!confirm(`Timpa data saat ini dengan ${list.length} karakter dari file ini?`)) return;
                charactersData = list;
                persist();
                showError('');
                refresh();
            } catch (err) {
                showError('File JSON tidak valid: ' + err.message);
            }
        };
        reader.readAsText(file);
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadData();
        
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.char-card')) {
                document.querySelectorAll('.char-card').forEach(c => c.classList.remove('active-card'));
            }
        });

        document.getElementById('sort-button').addEventListener('click', refresh);
        document.getElementById('export-button').addEventListener('click', exportJSON);
        document.getElementById('import-button').addEventListener('click', () => document.getElementById('import-file').click());
        document.getElementById('import-file').addEventListener('change', e => {
            if (e.target.files[0]) importJSON(e.target.files[0]);
            e.target.value = '';
        });
    });
    </script>
</body>
</html>
